[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    ESP32Ping
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    teckel12/NewPing
    bblanchon/ArduinoJson
    tzapu/WiFiManager
    ottowinter/ESPAsyncWebServer-esphome    ; WebSocket server
    ottowinter/AsyncTCP-esphome             ; Required dependency
