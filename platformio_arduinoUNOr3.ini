[env:uno]
platform = atmelavr
board = uno
framework = arduino

monitor_speed = 9600
upload_speed = 115200

build_flags =
    -D UNO_BOARD

lib_deps =
    ESP32Ping
    adafruit/DHT sensor library@^1.4.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    teckel12/NewPing
    bblanchon/ArduinoJson @ ^7.0.0